name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Enforce coverage floor
        run: npm run test:coverage

      - name: Check for stray debug pages and colon filenames
        # Issue #169: the `public/` directory is the Vite static-asset
        # root, so anything committed there ships to the browser.
        # Guard against re-introduction of (a) OS-invalid colon-named
        # files (Windows-incompatible, breaks `git checkout`) and
        # (b) debug `public/test-*.html` pages that have no test-runner
        # reference but get bundled into `dist/client/` outside Docker.
        # Runs before `Build` so a bad commit fails fast without
        # wasting CI time on a build that will probably fail anyway.
        run: |
          # POSIX-portable: `find -print -quit` exits 0 iff a match exists,
          # then `grep .` succeeds iff any line is printed. We invert the
          # success condition with `!` to fail the build on a match.
          if find public -name '*:*' -print -quit | grep .; then
            echo "::error::colon filename in public/ (Windows-incompatible)"
            exit 1
          fi
          if find public -name 'test-*.html' -print -quit | grep .; then
            echo "::error::debug test-*.html page in public/ (ships in production)"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        # Issue #168: the previous audit only inspected the production
        # tree, so advisories in dev-only security-sensitive tools (e.g.
        # GHSA-4w7w-66w2-5vf9 against vite@6.4.1) never blocked a PR. The
        # second step runs `npm audit` against the full tree at the
        # `moderate` level — any moderate-or-higher dev-dep advisory
        # fails the job. The high-level gate on the production tree is
        # kept as the primary merge blocker; the full-tree moderate
        # check is the secondary "we don't ship dev-dep CVEs either" guard.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=moderate
        continue-on-error: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
